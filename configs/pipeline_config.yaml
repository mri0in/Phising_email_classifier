# configs/pipeline_config.yaml

# ============================================================
# HOW TO RUN THE APPLICATION
# ============================================================
#
# Run using the default configuration:
#   python -m src.main
#
# Run a specific pipeline:
#   python -m src.main --pipeline preprocessing
#   python -m src.main --pipeline features
#   python -m src.main --pipeline training
#   python -m src.main --pipeline inference
#   python -m src.main --pipeline evaluation
#
# Train a specific model:
#   python -m src.main --pipeline training --model logistic_regression
#   python -m src.main --pipeline training --model linear_svm
#   python -m src.main --pipeline training --model naive_bayes
#   python -m src.main --pipeline training --model random_forest
#
# Compare all supported models (logistic regression, linear SVM, naive Bayes, random forest):
#   python -m src.main --compare-models
#
# Use a different configuration file:
#   python -m src.main --config configs/another_config.yaml
#
# IMPORTANT:
#   --compare-models independently trains all four models.
#   It does not reuse the model previously trained through
#   the individual training pipeline.
#
#   CLI arguments override the corresponding values in this file.
#
# ============================================================


application:
  # Default pipeline executed when --pipeline is not provided.
  default_pipeline: training

  # Default model used by the training pipeline.
  default_model: logistic_regression

  # Random seed used for reproducible training and feature generation.
  random_state: 42


paths:
  # Raw Kaggle dataset.
  raw_data: data/raw/Phishing_Email.csv

  # Output generated by the preprocessing pipeline.
  processed_data: data/processed/phishing_emails_processed.csv

  # TF-IDF feature artifacts.
  features_dir: artifacts/features

  # Saved TF-IDF vectorizer.
  vectorizer: artifacts/models/tfidf_vectorizer.joblib

  # Model artifact used by the normal training/inference/evaluation flow.
  selected_model: artifacts/models/phishing_classifier.joblib

  # Evaluation metrics for the selected model.
  evaluation_metrics: artifacts/metrics/evaluation_metrics.joblib

  # Directory containing independently trained comparison models.
  model_comparison: artifacts/model_comparison
  # Consolidated metrics generated by the model comparison workflow.
  model_comparison_metrics: artifacts/model_comparison/comparison_results.csv


inference:
  # Example email used by the inference pipeline.
  email_text: >
    URGENT: Your account has been suspended.
    Click the link immediately to verify your account
    and prevent permanent closure.

model_selection:
  # Metric to be used to select the best model after the model comparison workflow.
  enabled: true
  metric: f1
  direction: maximize