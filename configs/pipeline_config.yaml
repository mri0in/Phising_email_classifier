# configs/pipeline_config.yaml

# ============================================================
# APPLICATION CONFIGURATION
# ============================================================

application:
  default_pipeline: training
  default_model: logistic_regression
  random_state: 42


# ============================================================
# PATH CONFIGURATION
# ============================================================

paths:
  raw_data: data/raw/Phishing_Email.csv
  processed_data: data/processed/phishing_emails_processed.csv

  features_dir: artifacts/features
  vectorizer: artifacts/models/tfidf_vectorizer.joblib
  selected_model: artifacts/models/phishing_classifier.joblib

  evaluation_metrics: artifacts/metrics/evaluation_metrics.joblib

  model_comparison: artifacts/model_comparison
  model_comparison_metrics: artifacts/model_comparison/comparison_results.csv


# ============================================================
# FEATURE ENGINEERING CONFIGURATION
# ============================================================

features:

  # TF-IDF feature extraction parameters.
  tfidf:
    max_features: 10000
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95

  # Dataset split configuration.
  #
  # The FeaturePipeline currently performs the split in two stages:
  #   1. Training vs temporary data
  #   2. Temporary data -> validation + test
  #
  # These values represent the final desired proportions.
  split:
    train_size: 0.70
    validation_size: 0.15
    test_size: 0.15


# ============================================================
# MODEL TRAINING CONFIGURATION
# ============================================================

training:

  models:

    logistic_regression:
      C: 1.0
      max_iter: 1000
      class_weight: balanced

    linear_svm:
      C: 1.0
      max_iter: 1000
      class_weight: balanced

    naive_bayes:
      alpha: 1.0
      fit_prior: true

    random_forest:
      n_estimators: 200
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      class_weight: balanced
      n_jobs: -1


# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  email_text: >
    URGENT: Your account has been suspended.
    Click the link immediately to verify your account
    and prevent permanent closure.


# ============================================================
# MODEL SELECTION CONFIGURATION
# ============================================================

model_selection:
  enabled: true
  metric: f1
  direction: maximize

# ============================================================
# MLFLOW CONFIGURATION
# ============================================================

mlflow:
  enabled: true
  experiment_name: phishing_email_detection
  registered_model_name: phishing_detection_registered_model
  tracking_uri: null